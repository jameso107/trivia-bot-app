name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · types · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: Playwright · local Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The repo-pinned CLI (devDependency) starts the same stack CI tests
      # against — migrations apply automatically on a fresh start.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,logflare,vector

      - name: Export Supabase env
        run: |
          npx supabase status -o env > /tmp/supabase.env
          url=$(grep '^API_URL=' /tmp/supabase.env | cut -d'"' -f2)
          anon=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d'"' -f2)
          service=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d'"' -f2)
          test -n "$url" && test -n "$anon" && test -n "$service"
          echo "NEXT_PUBLIC_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"
          # Test-harness only: seeds fixtures + audits results. The app never
          # sees this key (CLAUDE.md hard rule).
          echo "SUPABASE_SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (production build)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
